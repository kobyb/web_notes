<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Notes</title>
<style>
  body { margin: 0; display: flex; background: #e9e9ec; font: 14px system-ui, sans-serif; color: #222; }
  #sheets { flex: none; width: 170px; height: 100vh; position: sticky; top: 0; overflow-y: auto; box-sizing: border-box;
            padding: 8px; background: #f7f7f8; border-right: 1px solid #ccc; }
  #add { width: 100%; margin-bottom: 4px; font-size: 18px; line-height: 1; }
  .io { display: flex; gap: 4px; margin-bottom: 8px; }
  .io button { flex: 1; }
  .sheet { display: flex; margin-bottom: 2px; border-radius: 4px; }
  .sheet button { border: 0; background: none; }
  .sheet .name { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .del { color: #999; padding: 4px 6px; }
  .sheet:hover { background: #e4e4e8; }
  .sheet.on { background: #dbe6fd; font-weight: 600; }
  .col { flex: 1; min-width: 0; }
  .bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
         padding: 8px 12px; background: #fff; border-bottom: 1px solid #ccc; }
  .bar span { display: flex; gap: 2px; }
  button, select, .bar input { font: inherit; padding: 4px 8px; border: 1px solid #bbb; border-radius: 4px; background: #fff; }
  button { cursor: pointer; }
  button[data-k="#"], button[data-k="-"], button[data-k="n"] { font-size: 18px; line-height: 1; padding: 2px 9px; }
  button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  #tempo { width: 4em; }
  #paper { width: 700px; max-width: calc(100% - 32px); box-sizing: content-box; margin: 20px auto; padding: 40px;
           background: #fff; box-shadow: 0 1px 6px #0003; overflow-x: auto; }
  #paper input { display: block; width: 100%; border: 0; outline: 0; background: none; font-family: Georgia, serif; color: #000; }
  #title { font-size: 28px; text-align: center; }
  #composer { font-size: 14px; text-align: right; margin-bottom: 10px; }
  .sys { break-inside: avoid; cursor: pointer; }
  .sys svg { display: block; overflow: visible; }
  .cursor { fill: #2563eb; opacity: .18; }
  .hint { color: #777; font-size: 12px; line-height: 1.7; margin-top: 24px; }
  kbd { border: 1px solid #ccc; border-radius: 3px; padding: 0 4px; background: #f6f6f6; }
  @page { margin: 0; }   /* zero page margin leaves the browser no room for its own header/footer (date, URL) */
  @media print {
    body { background: #fff; display: block; }
    #sheets, .bar, .hint, .cursor { display: none; }
    #paper { margin: 0 auto; padding: 12mm; max-width: none; box-shadow: none; overflow: visible; }
    #paper input::placeholder { color: transparent; }
  }
</style>

<nav id="sheets" aria-label="Sheets">
  <button id="add" title="New sheet">+</button>
  <div class="io">
    <button id="save" title="Save all sheets to a file">Save</button>
    <button id="load" title="Load sheets from a saved file">Load</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
  <div id="list"></div>
</nav>

<div class="col">
<div class="bar">
  <span>
    <button data-k="1" title="Whole note (1)">Whole</button>
    <button data-k="2" title="Half note (2)">Half</button>
    <button data-k="4" title="Quarter note (4)">Quarter</button>
    <button data-k="8" title="Eighth note (8)">8th</button>
    <button data-k="6" title="Sixteenth note (6)">16th</button>
  </span>
  <span>
    <button data-k="." title="Dotted (.)">Dot</button>
    <button data-k="r" title="Rest (R)">Rest</button>
    <button data-k="t" title="Tie to next note (T)">Tie</button>
  </span>
  <span>
    <button data-k="#" title="Sharp (# or +)">♯</button>
    <button data-k="-" title="Flat (-)">♭</button>
    <button data-k="n" title="Natural (N)">♮</button>
  </span>
  <label>Clef <select id="clef"><option>treble<option>bass<option value="alto">alto (C)<option value="tenor">tenor (C)</select></label>
  <label>Key <select id="key"></select></label>
  <label>Time <select id="time"></select></label>
  <label>Tempo <input id="tempo" type="number" min="30" max="300"></label>
  <span>
    <button data-k=" " id="play" title="Play / stop (Space)">▶ Play</button>
    <button data-k="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
    <button data-k="print">Print</button>
  </span>
</div>

<main id="paper">
  <input id="title" placeholder="Title" aria-label="Title">
  <input id="composer" placeholder="Composer" aria-label="Composer">
  <div id="score"></div>
  <p class="hint">
    <kbd>Enter</kbd> next note · <kbd>↑</kbd><kbd>↓</kbd> pitch (<kbd>Shift</kbd> = octave) · <kbd>A</kbd>–<kbd>G</kbd> note name ·
    <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd><kbd>2</kbd><kbd>4</kbd><kbd>8</kbd><kbd>6</kbd> length · <kbd>.</kbd> dot ·
    <kbd>R</kbd> rest · <kbd>T</kbd> tie · <kbd>#</kbd> sharp · <kbd>-</kbd> flat · <kbd>N</kbd> natural ·
    <kbd>Backspace</kbd> delete · <kbd>Space</kbd> play
  </p>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<script>
const VF = Vex.Flow, STORE = 'web_notes', W = 700, H = 150;
const KEYS = { C: 0, G: 1, D: 2, A: 3, E: 4, B: 5, 'F#': 6, 'C#': 7, F: -1, Bb: -2, Eb: -3, Ab: -4, Db: -5, Gb: -6, Cb: -7 };
const TIMES = ['2/4', '3/4', '4/4', '5/4', '2/2', '3/8', '6/8', '9/8', '12/8'];
const UNITS = { w: 32, h: 16, q: 8, 8: 4, 16: 2 };           // in 32nd notes
const DUR_KEY = { 1: 'w', 2: 'h', 4: 'q', 8: '8', 6: '16' };
const $ = id => document.getElementById(id);
const FIELDS = ['title', 'composer', 'tempo', 'clef', 'key', 'time'];
const MID = { treble: 34, bass: 22, alto: 28, tenor: 26 };    // step on the middle staff line: B4, D3, C4, A3
const blank = () => ({ title: '', composer: '', tempo: 100, clef: 'treble', key: 'C', time: '4/4', notes: [] });

// A note is { step, alter, dur, dot, rest, tie }. step = octave*7 + letter index (C=0), alter = -1/0/1 actual pitch.
// Parses saved text (localStorage or a file) and keeps only what the app can draw, so bad data can't break rendering.
function readSheets(text) {
  const s = JSON.parse(text), has = Object.hasOwn, b = blank();
  const list = (s?.sheets || (s?.notes ? [s] : []))             // s.notes: the old single-sheet format
    .filter(d => d && Array.isArray(d.notes)).map(d => ({
      title: String(d.title ?? ''), composer: String(d.composer ?? ''), tempo: Math.max(30, Math.min(300, +d.tempo || 100)),
      clef: has(MID, d.clef) ? d.clef : b.clef, key: has(KEYS, d.key) ? d.key : b.key, time: TIMES.includes(d.time) ? d.time : b.time,
      notes: d.notes
        .filter(n => n && has(UNITS, n.dur) && Number.isInteger(n.step) && n.step >= 14 && n.step <= 49 && [-1, 0, 1].includes(n.alter))
        .map(n => ({ step: n.step, alter: n.alter, dur: String(n.dur), dot: !!n.dot, rest: !!n.rest, tie: !!n.tie })),
    }));
  return { sheets: list, active: Math.max(0, Math.min(list.length - 1, s?.active | 0)) };
}
let sheets = [], active = 0;
try { ({ sheets, active } = readSheets(localStorage.getItem(STORE))); } catch {}
if (!sheets.length) sheets = [blank()];
let doc = sheets[active];
let cur = doc.notes.length - 1, saved = JSON.stringify(doc), hist = [], pos = [], ac = null, timers = [];

const units = n => UNITS[n.dur] * (n.dot ? 1.5 : 1);
const midi = n => 12 * (Math.floor(n.step / 7) + 1) + [0, 2, 4, 5, 7, 9, 11][n.step % 7] + n.alter;
const keyAlter = (li, k = KEYS[doc.key]) =>
  k > 0 && 'FCGDAEB'.indexOf('CDEFGAB'[li]) < k ? 1 : k < 0 && 'BEADGCF'.indexOf('CDEFGAB'[li]) < -k ? -1 : 0;
const vfKey = n => 'cdefgab'[(n.rest ? MID[doc.clef] : n.step) % 7] + (n.rest ? '' : ['b', '', '#'][n.alter + 1])
  + '/' + Math.floor((n.rest ? MID[doc.clef] : n.step) / 7);
const tiesTo = i => { const a = doc.notes[i], b = doc.notes[i + 1]; return a.tie && b && !a.rest && !b.rest; };

// ponytail: a note longer than the room left in its bar stays in that bar (bar runs long);
// auto-splitting into tied notes across the barline if that gets annoying.
function measures(notes, time) {
  const [num, den] = time.split('/').map(Number), cap = num * 32 / den, ms = [[]];
  let fill = 0;
  notes.forEach((n, i) => {
    if (fill >= cap) { ms.push([]); fill = 0; }
    ms.at(-1).push(i); fill += units(n);
  });
  return ms;
}

// ponytail: full re-engrave on every edit; cache per-line SVGs if scores get long enough to lag.
function render() {
  const score = $('score'), last = doc.notes.length - 1;
  score.textContent = ''; pos = [];
  const head = first => {
    const s = new VF.Stave(0, 0, 400).addClef(doc.clef).addKeySignature(doc.key);
    if (first) s.addTimeSignature(doc.time);
    return s.getNoteStartX();
  };
  const ms = measures(doc.notes, doc.time).map(idx => ({
    idx, w: idx.length ? 26 + idx.reduce((a, i) => a + (doc.notes[i].dur === '16' ? 30 : 38), 0) : W,
  }));
  const lines = [];
  for (const m of ms) {
    let l = lines.at(-1);
    if (!l || l.used + m.w > W) lines.push(l = { ms: [], used: head(!lines.length), sum: 0 });
    l.ms.push(m); l.used += m.w; l.sum += m.w;
  }
  const lastLi = lines.length - 1;
  while (lines.length < 2) lines.push({ ms: [{ idx: [], w: W }], used: head(false) + W, sum: W });   // page always shows 2+ staff lines
  lines.forEach((l, li) => {
    const div = score.appendChild(document.createElement('div'));
    div.className = 'sys';
    const r = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    r.resize(W + 2, H);
    const ctx = r.getContext(), hd = l.used - l.sum;
    let scale = (W - hd) / l.sum;
    if (li >= lastLi) scale = Math.min(scale, 1.3);   // don't stretch a short final line
    let x = 0;
    l.ms.forEach((m, k) => {
      const width = m.w * scale + (k ? 0 : hd), stave = new VF.Stave(x, 15, width);
      x += width;
      if (!k) {
        stave.addClef(doc.clef).addKeySignature(doc.key);
        if (!li) stave.addTimeSignature(doc.time).setTempo({ duration: 'q', bpm: doc.tempo }, 0);
      }
      if (m === ms.at(-1) && m.idx.length) stave.setEndBarType(VF.Barline.type.END);
      stave.setContext(ctx).draw();
      if (!m.idx.length) return;
      const sn = m.idx.map(i => {
        const n = doc.notes[i];
        const s = new VF.StaveNote({ keys: [vfKey(n)], clef: doc.clef, auto_stem: true,
                                     duration: n.dur + (n.dot ? 'd' : '') + (n.rest ? 'r' : '') });
        if (n.dot) VF.Dot.buildAndAttach([s]);
        pos[i] = { div, ctx, note: s };
        return s;
      });
      const voice = new VF.Voice().setMode(VF.Voice.Mode.SOFT).addTickables(sn);
      VF.Accidental.applyAccidentals([voice], doc.key);
      const beams = VF.Beam.generateBeams(sn, { groups: VF.Beam.getDefaultBeamGroups(doc.time) });
      new VF.Formatter().joinVoices([voice]).formatToStave([voice], stave);
      voice.draw(ctx, stave);
      beams.forEach(b => b.setContext(ctx).draw());
    });
    div.onclick = e => {
      const cx = e.clientX - div.getBoundingClientRect().left;
      let best = -1, bd = Infinity;
      pos.forEach((p, i) => {
        const d = Math.abs(p.note.getAbsoluteX() - cx);
        if (p.div === div && d < bd) { bd = d; best = i; }
      });
      if (best >= 0) { cur = best; showCursor(); }
    };
  });
  for (let i = 0; i < last; i++) {
    if (!tiesTo(i)) continue;
    const a = pos[i], b = pos[i + 1], tie = (p, f, t) =>
      new VF.StaveTie({ first_note: f, last_note: t, first_indices: [0], last_indices: [0] }).setContext(p.ctx).draw();
    if (a.div === b.div) tie(a, a.note, b.note);
    else { tie(a, a.note, null); tie(b, null, b.note); }      // tie across a line break
  }
  showCursor();
}

function showCursor() {
  document.querySelector('.cursor')?.remove();
  const p = pos[cur], n = doc.notes[cur];
  if (p) {
    const bb = p.note.getBoundingBox(), rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    Object.entries({ class: 'cursor', x: bb.getX() - 5, y: 40, width: bb.getW() + 10, height: 70, rx: 4 })
      .forEach(([k, v]) => rect.setAttribute(k, v));
    p.div.querySelector('svg').prepend(rect);
    rect.scrollIntoView({ block: 'nearest' });
  }
  listSheets();
  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    b.classList.toggle('on', !!n && (DUR_KEY[k] === n.dur || k === '.' && n.dot || k === 'r' && n.rest || k === 't' && n.tie
      || !n.rest && (k === '#' && n.alter === 1 || k === '-' && n.alter === -1)));
  });
  $('play').textContent = ac ? '■ Stop' : '▶ Play';
}

function fill() { FIELDS.forEach(id => $(id).value = doc[id]); }
function store() { sheets[active] = doc; try { localStorage.setItem(STORE, JSON.stringify({ sheets, active })); } catch {} }
// ponytail: undo history is per visit to a sheet; switching sheets clears it.
function openSheet(i) {
  if (ac) stop();
  active = i; doc = sheets[i]; saved = JSON.stringify(doc); hist = []; cur = doc.notes.length - 1;
  store(); fill(); render();
}
function listSheets() {
  $('list').replaceChildren(...sheets.map((d, i) => {
    const row = document.createElement('div'), name = document.createElement('button'), del = document.createElement('button');
    row.className = 'sheet' + (i === active ? ' on' : '');
    name.className = 'name'; name.textContent = name.title = d.title || 'Untitled'; name.dataset.open = i;
    del.className = 'del'; del.textContent = '×'; del.title = 'Delete sheet'; del.dataset.del = i;
    row.append(name, del);
    return row;
  }));
}
function commit() {
  const s = JSON.stringify(doc);
  if (s !== saved) { hist.push(saved); saved = s; store(); }
  render();
}

function act(k) {
  const ns = doc.notes;
  let n = ns[cur];
  const setStep = s => { n.step = Math.max(14, Math.min(49, s)); n.alter = keyAlter(n.step % 7); n.rest = false; };
  if (k === 'Enter' || !n && /^[a-g]$/.test(k)) {
    const step = MID[doc.clef] ?? 34;
    n = n ? { ...n, tie: false, rest: false } : { step, alter: keyAlter(step % 7), dur: 'q', dot: false, rest: false, tie: false };
    ns.splice(++cur, 0, n);
  }
  if (k === ' ') return play();
  if (k === 'print') return print();
  if (k === 'undo') {
    if (!hist.length) return;
    saved = hist.pop(); doc = JSON.parse(saved); store();
    cur = Math.min(cur, doc.notes.length - 1); fill(); return render();
  }
  if (!n) return;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Home' || k === 'End') {
    cur = k === 'Home' ? 0 : k === 'End' ? ns.length - 1 : Math.max(0, Math.min(ns.length - 1, cur + (k === 'ArrowLeft' ? -1 : 1)));
    return showCursor();
  }
  if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'OctUp' || k === 'OctDown')
    setStep(n.step + (k.endsWith('Up') ? 1 : -1) * (k.startsWith('Oct') ? 7 : 1));
  else if (/^[a-g]$/.test(k)) {                                // nearest octave to the current pitch
    const base = n.step - n.step % 7 + 'cdefgab'.indexOf(k);
    setStep([base - 7, base, base + 7].sort((a, b) => Math.abs(a - n.step) - Math.abs(b - n.step))[0]);
  }
  else if (DUR_KEY[k]) n.dur = DUR_KEY[k];
  else if (k === '.') n.dot = !n.dot;
  else if (k === 'r') n.rest = !n.rest;
  else if (k === 't') n.tie = !n.tie;
  else if (k === '#' || k === '+' || k === '=') n.alter = 1;
  else if (k === '-') n.alter = -1;
  else if (k === 'n') n.alter = 0;
  else if (k === 'Backspace' || k === 'Delete') { ns.splice(cur, 1); cur = Math.max(cur - 1, ns.length ? 0 : -1); }
  commit();
}

function stop() {
  timers.forEach(clearTimeout); timers = [];
  ac?.close(); ac = null; showCursor();
}
function play() {
  if (ac) return stop();
  if (!doc.notes.length) return;
  ac = new AudioContext();
  const t0 = ac.currentTime + 0.05, sec = 60 / doc.tempo / 8;   // seconds per 32nd
  let t = t0, held = false;
  doc.notes.forEach((n, i) => {
    timers.push(setTimeout(() => { cur = i; showCursor(); }, (t - t0) * 1000));
    const same = j => tiesTo(j) && midi(doc.notes[j]) === midi(doc.notes[j + 1]);
    if (!n.rest && !held) {
      let len = units(n), j = i;
      while (same(j)) len += units(doc.notes[++j]);
      const o = ac.createOscillator(), g = ac.createGain(), end = t + len * sec;
      o.type = 'triangle'; o.frequency.value = 440 * 2 ** ((midi(n) - 69) / 12);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, end);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(end);
    }
    held = same(i);
    t += units(n) * sec;
  });
  timers.push(setTimeout(stop, (t - t0) * 1000 + 100));
  showCursor();
}

addEventListener('keydown', e => {
  if (e.target.matches('input, select')) { if (e.key === 'Enter' || e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey) { if (e.key === 'z') { e.preventDefault(); act('undo'); } return; }
  const k = e.shiftKey && e.key === 'ArrowUp' ? 'OctUp' : e.shiftKey && e.key === 'ArrowDown' ? 'OctDown'
    : e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (/^(Enter|Arrow.*|Home|End|Backspace|Delete|[a-g1248.rtn#+=\- 6])$/.test(k)) { e.preventDefault(); act(k); }
});
document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b) { b.blur(); act(b.dataset.k); }
});
$('sheets').addEventListener('click', e => {
  const { open, del } = e.target.dataset;
  e.target.blur?.();
  if (e.target.id === 'add') { sheets.push(blank()); openSheet(sheets.length - 1); }
  else if (e.target.id === 'load') $('file').click();
  else if (e.target.id === 'save') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ sheets, active }, null, 1)], { type: 'application/json' }));
    a.download = 'web_notes.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  else if (open) openSheet(+open);
  else if (del) {
    const d = sheets[del];
    if ((d.notes.length || d.title) && !confirm(`Delete "${d.title || 'Untitled'}"? This cannot be undone.`)) return;
    sheets.splice(del, 1);
    if (!sheets.length) sheets.push(blank());
    openSheet(Math.min(sheets.length - 1, active - (del < active ? 1 : 0)));
  }
});
$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';                                          // so the same file can be loaded again
  if (!f) return;
  let got;
  try { got = readSheets(await f.text()); } catch {}
  if (!got?.sheets.length) return alert('That file has no Web Notes sheets in it.');
  if (sheets.some(d => d.notes.length || d.title) && !confirm(`Replace all current sheets with the ${got.sheets.length} in "${f.name}"?`)) return;
  sheets = got.sheets; openSheet(got.active);
};
for (const k in KEYS) $('key').add(new Option(k));
for (const t of TIMES) $('time').add(new Option(t));
FIELDS.forEach(id => {
  const el = $(id);
  el.oninput = () => { doc[id] = id === 'tempo' ? Math.max(30, Math.min(300, +el.value || 100)) : el.value; commit(); };
  if (el.tagName === 'SELECT') el.onchange = () => el.blur();
});

// self-check: fails loudly in the console if pitch/bar maths break
console.assert(midi({ step: 33, alter: 0 }) === 69 && keyAlter(3, 1) === 1 && keyAlter(6, -1) === -1 && keyAlter(0, 2) === 1
  && measures([{ dur: 'q' }, { dur: 'h', dot: true }, { dur: '8' }], '4/4').map(m => m.length).join() === '2,1', 'self-check failed');

fill(); render();
</script>
</html>
